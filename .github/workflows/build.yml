name: Bouw YF Schaak

# Start bij elke wijziging, of met de hand via het tabblad "Actions".
on:
  push:
  workflow_dispatch:

jobs:
  tests:
    name: Engine-tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Engine compileren met strenge waarschuwingen
        run: |
          gcc --version | head -1
          gcc -std=c99 -O2 -Wall -Wextra -Werror -IEngine \
            Engine/ChessEngine.c Engine/ChessBot.c Engine/ChessPuzzles.c Tests/test_engine.c -o test_engine -lm
          clang -std=c99 -O2 -Wall -Wextra -Werror -IEngine \
            Engine/ChessEngine.c Engine/ChessBot.c Engine/ChessPuzzles.c Tests/test_engine.c -o test_engine_clang -lm

      - name: Tests draaien
        run: ./test_engine

      - name: Tests draaien met clang
        run: ./test_engine_clang

      - name: Tests met geheugencontrole (AddressSanitizer + UBSan)
        run: |
          gcc -std=c99 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -IEngine \
            Engine/ChessEngine.c Engine/ChessBot.c Engine/ChessPuzzles.c Tests/test_engine.c -o test_engine_asan -lm
          ./test_engine_asan

  build:
    name: App bouwen (iOS 9, armv7)
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      THEOS: ${{ github.workspace }}/theos
      SDK_NAME: iPhoneOS14.5

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4
        with:
          path: project

      - name: Linux-pakketten installeren
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip unzip git libxml2 libtinfo6 file librsvg2-bin

      - name: Theos downloaden
        run: git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"

      - name: iOS-toolchain downloaden (compiler en linker)
        run: |
          mkdir -p "$THEOS/toolchain"
          curl -fsSL "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz" \
            | tar -xJf - -C "$THEOS/toolchain/"
          ls "$THEOS/toolchain/linux/iphone/bin"

      - name: ldid (nep-ondertekening) klaarzetten
        run: |
          TC="$THEOS/toolchain/linux/iphone/bin"
          if command -v ldid >/dev/null 2>&1; then
            echo "ldid gevonden: $(command -v ldid)"
          elif [ -x "$TC/ldid" ]; then
            sudo ln -sf "$TC/ldid" /usr/local/bin/ldid
          else
            sudo curl -fsSL -o /usr/local/bin/ldid \
              "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64"
            sudo chmod +x /usr/local/bin/ldid
          fi
          ldid 2>&1 | head -3 || true

      - name: iOS ${{ env.SDK_NAME }} SDK downloaden
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$THEOS/bin/install-sdk" "$SDK_NAME"
          SDK="$THEOS/sdks/$SDK_NAME.sdk"
          # De interne (private) WebKit-map kan openbare headers verbergen; we gebruiken hem niet.
          rm -rf "$SDK/System/Library/PrivateFrameworks/WebKit.framework"
          ls "$SDK/System/Library/Frameworks/UIKit.framework/Headers" | head -3

      - name: Stukken omzetten (SVG naar PNG)
        working-directory: project
        run: |
          for dir in Art/pieces/*/; do
            set_name=$(basename "$dir")
            for svg in "$dir"*.svg; do
              name=$(basename "$svg" .svg)
              rsvg-convert -w 160 -h 160 -a "$svg" -o "Resources/${set_name}-${name}.png"
            done
          done
          ls Resources | grep -c "\.png$"
          test "$(ls Resources/cburnett-*.png Resources/staunty-*.png | wc -l)" -eq 24

      - name: App bouwen
        working-directory: project
        run: |
          sed -i 's/\r$//' layout/DEBIAN/postinst
          chmod 755 layout/DEBIAN/postinst
          make -k clean package FINALPACKAGE=1 messages=yes

      - name: Controleren (ARMv7 en iOS 9)
        working-directory: project
        run: |
          APP=".theos/_/Applications/YFChess.app"
          BIN="$APP/YFChess"
          TC="$THEOS/toolchain/linux/iphone/bin"
          INFO="$(file "$BIN")"
          if [ -x "$TC/lipo" ]; then INFO="$INFO / $("$TC/lipo" -info "$BIN")"; fi
          echo "Architectuur: $INFO"
          if echo "$INFO" | grep -qi "arm64" && ! echo "$INFO" | grep -qiE "armv7|arm_v7"; then
            echo "::error::De app is niet voor ARMv7 gebouwd!"
            exit 1
          fi
          if [ -x "$TC/otool" ]; then
            "$TC/otool" -l "$BIN" | grep -A4 -E "LC_VERSION_MIN_IPHONEOS|LC_BUILD_VERSION" || true
            echo "Frameworks:"
            "$TC/otool" -L "$BIN" || true
          fi
          grep -A1 MinimumOSVersion "$APP/Info.plist" || true
          ls -l "$APP"

      - name: IPA maken
        working-directory: project
        run: |
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R ".theos/_/Applications/YFChess.app" ipa/Payload/
          (cd ipa && zip -qr ../packages/YFChess.ipa Payload)
          ls -l packages

      - name: Resultaat bewaren (download dit)
        uses: actions/upload-artifact@v4
        with:
          name: YFChess
          path: |
            project/packages/*.ipa
            project/packages/*.deb

      - name: Release op GitHub zetten (bij Releases)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: project
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(grep '^Version:' control | awk '{print $2}')
          TAG="v$VERSION"
          # Uitleg voor deze versie uit CHANGELOG.md halen.
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "YF Schaak versie $VERSION" > notes.md
          echo "" >> notes.md
          echo "**Installeren op de iPad:** download \`YFChess-$VERSION.ipa\` en installeer met iOSApp Proxy Install of Filza (AppSync Unified nodig). De \`.deb\` kan ook via Filza." >> notes.md
          cp packages/YFChess.ipa "packages/YFChess-$VERSION.ipa"
          DEB=$(ls packages/*.deb | head -1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG bestaat al: bestanden en tekst bijwerken."
            gh release upload "$TAG" "packages/YFChess-$VERSION.ipa" "$DEB" --clobber
            gh release edit "$TAG" --title "YF Schaak $VERSION" --notes-file notes.md
          else
            gh release create "$TAG" "packages/YFChess-$VERSION.ipa" "$DEB" --title "YF Schaak $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
          gh release view "$TAG"
